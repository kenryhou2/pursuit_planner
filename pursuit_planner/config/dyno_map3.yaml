dynamic_obstacles:
  # Large sweeping obstacle across middle region
  - id: obs0
    footprint:
      kind: circle
      radius: 25
    waypoints:
      - x: 100
        y: 150
        duration: 0
      - x: 280
        y: 180
        duration: 140
      - x: 100
        y: 220
        duration: 140
      - x: 100
        y: 150
        duration: 100

  # Vertical patrol obstacle
  - id: obs1
    footprint:
      kind: box
      width: 32
      height: 32
    waypoints:
      - x: 190
        y: 100
        duration: 0
      - x: 190
        y: 270
        duration: 150
      - x: 190
        y: 100
        duration: 150

  # Diagonal moving obstacle
  - id: obs2
    footprint:
      kind: circle
      radius: 18
    waypoints:
      - x: 150
        y: 120
        duration: 0
      - x: 270
        y: 240
        duration: 100
      - x: 150
        y: 120
        duration: 100

  # Additional complexity in upper region
  - id: obs3
    footprint:
      kind: box
      width: 28
      height: 28
    waypoints:
      - x: 240
        y: 220
        duration: 0
      - x: 320
        y: 290
        duration: 95
      - x: 240
        y: 220
        duration: 95